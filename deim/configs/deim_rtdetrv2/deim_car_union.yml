__include__: [
  './deim_r18vd_120e_coco.yml',
]

num_classes: 6
remap_mscoco_category: False
eval_spatial_size: ~

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:/BaiduNetdiskDownload/wdd_work/data/car_union_sliced/train
    ann_file: D:/BaiduNetdiskDownload/wdd_work/deim/data_car_union/car_union_train_10.json
    return_masks: False
  shuffle: True
  num_workers: 6
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 1
    stop_epoch: 100

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:/BaiduNetdiskDownload/wdd_work/data/car_union_sliced/val
    ann_file: D:/BaiduNetdiskDownload/wdd_work/deim/data_car_union/car_union_val.json
    return_masks: False
  shuffle: False
  num_workers: 6
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640

output_dir: ./output/deim_car_union

epoches: 60
