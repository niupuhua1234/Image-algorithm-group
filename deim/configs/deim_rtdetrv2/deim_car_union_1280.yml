__include__: [
  './deim_r18vd_120e_coco.yml',
]

num_classes: 6
remap_mscoco_category: False
eval_spatial_size: ~

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:/BaiduNetdiskDownload/wdd_work/data/car_union_bal25_1280/train
    ann_file: D:/BaiduNetdiskDownload/wdd_work/deim/data_car_union_bal1280/car_union_bal1280_train_v3.json
    return_masks: False
    transforms:
      # 覆盖继承链的 Resize[640,640] → 1024(训练输入 1024 保持目标分辨率)
      policy:
        epoch: [4, 64, 117]
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [960, 960], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 6
  drop_last: True
  total_batch_size: 8        # 960输入, batch 8
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 960          # 训练输入 960(用户指定)
    base_size_repeat: 1
    stop_epoch: 60

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:/BaiduNetdiskDownload/wdd_work/data/car_union_bal25_1280/val
    ann_file: D:/BaiduNetdiskDownload/wdd_work/deim/data_car_union_bal1280/car_union_bal1280_val.json
    return_masks: False
  shuffle: False
  num_workers: 6
  drop_last: False
  total_batch_size: 32
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 960

output_dir: ./output/deim_car_union_v3

# 适配 60ep 的调度: flat_epoch 30, no_aug_epoch 2（自定义覆盖）
epoches: 60
flat_epoch: 30
no_aug_epoch: 2
