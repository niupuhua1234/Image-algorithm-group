__include__: [
  './deim_r18vd_120e_coco.yml',
]

# ============================================================================
# 类增量 第一阶段 (inc_p1): 4 类 -> 6 类, 新增 military_fuel_tanker / radar_vehicle
#
# 起点: 用 expand_head.py 从 base/transfer 权重扩展出的 6 类 checkpoint
#       (老类权重原样保留, 新类零初始化)
#
# 训练数据: inc_p1/annotations/train_replay.json
#   新类  1,050 图 (military_fuel_tanker 2,016 框 + radar_vehicle 2,036 框)
#   回放  1,050 图 (从 base/train 抽, 老类各约 965 框)
#   -> 新老比例约 1:1
#
# 防遗忘四件套:
#   ① 回放    —— 见上面的数据构造(train_replay.json)
#   ② 冻结    —— backbone 全冻, BN 冻结
#   ③ 低 lr   —— 2e-5(base 的 1/10)
#   ④ 短训练  —— 12 epoch(每 epoch 525 iter, 合计约 6,300 iter)
#
# ⚠️ 关于蒸馏:
#   本仓库的引擎把训练循环封装在 solver 里, 要在其中插入 teacher 前向需要改动
#   solver/_solver.py(652 行)。当前先用"回放 + 冻结 + 低 lr"三件套落地,
#   蒸馏作为后续增强项(见 docs 里的说明)。回放是防遗忘的主力手段。
# ============================================================================
num_classes: 6
remap_mscoco_category: False
eval_spatial_size: ~

# ---- 冻结: 保护已经学好的通用特征 ----
PResNet:
  freeze_at: 1
  freeze_norm: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    # file_name 已写成 base/images/train/xxx.jpg 这种相对路径, 所以 img_folder 用根目录
    img_folder: D:/BaiduNetdiskDownload/datasets/vistarget_work
    ann_file: D:/BaiduNetdiskDownload/datasets/vistarget_work/inc_p1/annotations/train_replay.json
    return_masks: False
    transforms:
      # 增量阶段不做强增强: 目标是稳住老类 + 学会新类, Mosaic 会破坏小目标
      policy:
        epoch: [999, 999, 999]     # 策略永不触发, 等于全程关闭 Mosaic 等
      ops:
        - {type: RandomPhotometricDistort, p: 0.3}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1280, 1280], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 6
  drop_last: True
  total_batch_size: 4
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280
    base_size_repeat: 1
    mixup_prob: 0.0
    mixup_epochs: [0, 0]
    stop_epoch: 20

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: D:/BaiduNetdiskDownload/datasets/vistarget_work
    ann_file: D:/BaiduNetdiskDownload/datasets/vistarget_work/inc_p1/annotations/rel_val.json
    return_masks: False
  shuffle: False
  num_workers: 6
  drop_last: False
  total_batch_size: 8
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1280

optimizer:
  type: AdamW
  params:
    - params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00003               # 2e-5
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 300
flat_epoch: 10
no_aug_epoch: 3
epoches: 20

output_dir: ./output/deim_vistarget_inc_p1

# ============================================================================
# 训练命令(等 transfer 完成后执行):
#   python expand_head.py \
#       --config configs/deim_rtdetrv2/deim_vistarget_transfer.yml \
#       --ckpt  output/deim_vistarget_transfer/best_stg1.pth \
#       --new-num-classes 6 \
#       --out-ckpt output/inc_p1_init.pth \
#       --out-config configs/deim_rtdetrv2/deim_vistarget_inc_p1_init.yml
#
#   python train.py -c configs/deim_rtdetrv2/deim_vistarget_inc_p1.yml \
#       -d cuda:0 --use-amp -t output/inc_p1_init.pth
#
# 验收(三件事都要做):
#   1) inc_p1/test 上测 6 类整体 recall
#   2) base/test 上测老类 recall  -> 掉点需 < 3pp
#   3) 用 sweep_conf.py --conf-grid 细扫, 报误检率
# ============================================================================
